<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 文件处理弹窗</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      background: #eef2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1f2937;
    }

    .page {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #eef3f8 0%, #dfe7ef 100%);
    }

    .mock-table {
      position: absolute;
      inset: 80px 120px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(31, 41, 55, 0.12);
      opacity: 0.65;
      overflow: hidden;
    }

    .mock-table-header {
      height: 58px;
      background: #f6f8fb;
      border-bottom: 1px solid #e5e7eb;
    }

    .mock-row {
      height: 56px;
      border-bottom: 1px solid #edf0f5;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 32px;
    }

    .mock-cell {
      height: 14px;
      border-radius: 999px;
      background: #d8dee8;
    }

    .mock-cell:nth-child(1) {
      width: 180px;
    }

    .mock-cell:nth-child(2) {
      width: 280px;
    }

    .mock-cell:nth-child(3) {
      width: 120px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.48);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .dialog {
      width: 690px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.28);
      overflow: hidden;
      position: relative;
    }

    .dialog::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #2f6bff;
    }

    .dialog-body {
      padding: 36px 42px 28px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 34px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 4px solid #dbe7ff;
      border-top-color: #2f6bff;
      animation: spin 1s linear infinite;
      flex: 0 0 auto;
      margin-top: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }

    .filename {
      font-size: 16px;
      line-height: 24px;
      color: #6b7280;
      margin-top: 4px;
    }

    .progress-section {
      margin-bottom: 26px;
    }

    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .progress-label {
      font-size: 16px;
      color: #6b7280;
      font-weight: 500;
    }

    .progress-percent {
      font-size: 18px;
      color: #2f6bff;
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #eef1f5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 50%;
      height: 100%;
      background: #2f6bff;
      border-radius: 999px;
    }

    .divider {
      height: 1px;
      background: #edf0f4;
      margin: 28px 0;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      column-gap: 14px;
      min-height: 32px;
    }

    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-icon.done {
      background: #e8f8f1;
      border: 2px solid #8edfc0;
      color: #16a36a;
      font-size: 15px;
      font-weight: 800;
    }

    .step-icon.processing {
      border: 3px solid #dbe7ff;
      border-top-color: #2f6bff;
      animation: spin 1s linear infinite;
    }

    .step-name {
      font-size: 18px;
      font-weight: 600;
      color: #374151;
      line-height: 28px;
    }

    .step-status {
      font-size: 17px;
      font-weight: 600;
      color: #18a266;
      white-space: nowrap;
    }

    .step-status.processing {
      color: #2f6bff;
    }

    .merged-step {
      border: 1px solid #d8e0ec;
      border-radius: 12px;
      padding: 18px 18px 16px;
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .merged-main {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      column-gap: 14px;
    }

    .merged-name {
      font-size: 18px;
      font-weight: 700;
      color: #374151;
      line-height: 28px;
    }

    .merged-status {
      font-size: 17px;
      font-weight: 700;
      color: #2f6bff;
      white-space: nowrap;
    }

    .merged-desc {
      margin: 8px 0 0 42px;
      font-size: 15px;
      line-height: 24px;
      color: #6b7280;
    }

    .bottom {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #edf0f4;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tip {
      font-size: 14px;
      color: #8a94a6;
    }

    .cancel-btn {
      min-width: 86px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #d0d7e2;
      background: #ffffff;
      color: #374151;
      font-size: 15px;
      cursor: pointer;
    }

    .cancel-btn:hover {
      background: #f6f8fb;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="mock-table">
      <div class="mock-table-header"></div>
      <div class="mock-row">
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
      </div>
      <div class="mock-row">
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
      </div>
      <div class="mock-row">
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
      </div>
      <div class="mock-row">
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
        <div class="mock-cell"></div>
      </div>
    </div>

    <div class="overlay">
      <div class="dialog">
        <div class="dialog-body">
          <div class="header">
            <div class="spinner"></div>
            <div>
              <h1 class="title">AI 正在处理文件</h1>
              <div class="filename">招标图纸_综合楼_v3.2.pdf</div>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-head">
              <div class="progress-label">解析进度</div>
              <div class="progress-percent">50%</div>
            </div>
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="steps">
            <div class="step">
              <div class="step-icon done">✓</div>
              <div class="step-name">文档解析</div>
              <div class="step-status">已完成</div>
            </div>

            <div class="merged-step">
              <div class="merged-main">
                <div class="step-icon processing"></div>
                <div class="merged-name">清单智能解析</div>
                <div class="merged-status">解析中 · 32 / 54 条</div>
              </div>
              <div class="merged-desc">
                正在提取清单项，并同步完成材料推演与工程量计算
              </div>
            </div>
          </div>

          <div class="bottom">
            <div class="tip">提示：解析完成后将自动进入下一步</div>
            <button class="cancel-btn">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
