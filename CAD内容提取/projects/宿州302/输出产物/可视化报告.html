<style>
  :root {
    --bg: #f4f2ed; --card: #fff; --text: #1a1a1a; --muted: #8b8b8b;
    --red: #c44d34; --blue: #2b6cb0; --green: #276749; --amber: #c05621;
    --border: #e0dcd5; --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  header { text-align: center; padding: 48px 0 36px; }
  header .tagline { display: inline-block; background: var(--red); color: #fff; font-size: 12px; padding: 3px 14px; border-radius: 20px; letter-spacing: 1px; margin-bottom: 12px; }
  header h1 { font-size: 30px; font-weight: 800; }
  header .meta { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* BOQ 主表 */
  .boq-master { background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 32px; }
  .boq-master table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .boq-master th { background: #1a1a1a; color: #fff; padding: 14px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; text-align: left; }
  .boq-master td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .boq-master tr:hover td { background: #fafaf7; }
  .boq-master .item-num { font-size: 28px; font-weight: 800; color: var(--muted); width: 50px; text-align: center; }
  .boq-master .item-name { font-size: 16px; font-weight: 700; }
  .boq-master .item-spec { font-size: 13px; color: var(--muted); }
  .boq-master .item-qty { font-size: 20px; font-weight: 700; text-align: right; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .tag-match { background: #c6f6d5; color: #22543d; }
  .tag-partial { background: #fefcbf; color: #975a16; }
  .tag-none { background: #fed7d7; color: #9b2c2c; }

  /* 匹配卡片 */
  .match-card { background: var(--card); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); border-left: 4px solid var(--green); overflow: hidden; }
  .match-card.partial { border-left-color: var(--amber); }
  .match-card.none { border-left-color: var(--red); }
  .match-card .card-header { padding: 20px 24px; cursor: pointer; display: flex; align-items: center; gap: 16px; user-select: none; }
  .match-card .card-header:hover { background: #fafaf7; }
  .match-card .card-header .arrow { font-size: 16px; transition: transform .2s; color: var(--muted); }
  .match-card.open .card-header .arrow { transform: rotate(90deg); }
  .match-card .card-body { display: none; padding: 0 24px 24px; border-top: 1px solid var(--border); }
  .match-card.open .card-body { display: block; }
  .match-card .summary-stats { display: flex; gap: 24px; font-size: 13px; color: var(--muted); margin-left: auto; text-align: center; }
  .match-card .summary-stats strong { color: var(--text); font-size: 16px; display: block; }

  table.sub { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
  table.sub th { background: #f8f7f4; text-align: left; padding: 10px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px solid var(--border); }
  table.sub td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.sub tr:last-child td { border-bottom: none; }

  .layers { list-style: none; padding: 0; margin: 0; }
  .layers li { padding: 5px 10px; font-size: 13px; border-left: 3px solid #e0dcd5; margin: 2px 0; }
  .layers li:last-child { border-left-color: var(--red); font-weight: 600; }
  .layers li .seq { display: inline-block; width: 22px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .layers li .fr { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 4px; background: #bee3f8; color: #2a4365; }

  .gap-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 16px 20px; margin-top: 16px; font-size: 13px; }
  .gap-box strong { color: var(--amber); }

  .material-bar { padding: 12px 16px; background: #f0fff4; border-radius: 6px; margin-top: 16px; font-size: 13px; }
  .material-bar strong { color: var(--green); }

  footer { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; }
  @media (max-width: 768px) {
    header h1 { font-size: 22px; }
    .match-card .summary-stats { display: none; }
    .boq-master .item-num { font-size: 18px; width: 36px; }
    .boq-master .item-qty { font-size: 16px; }
  }
</style>
</head>

  4: { kw: ['地砖','面砖','防滑地砖'], hint: '', itemType: '地面材料' },
  5: { kw: ['墙砖','面砖','瓷砖'], hint: '需提取内墙做法表', itemType: '墙面材料' },
  6: { kw: ['吊顶','龙骨','石膏板','矿棉板'], hint: '需提取顶棚做法表', itemType: '吊顶材料' },
};

// BOQ主表
document.getElementById('boqMasterBody').innerHTML = boq.map(b => {
  const rule = boqMatchRules[b['序号']];
  const matched = filterItems(allItems, rule.kw);
  const bldSet = new Set(matched.map(m=>m.building));
  let status;
  if (matched.length>0) status = `<span class="tag tag-match">✓ ${matched.length}条做法 · ${bldSet.size}栋</span>`;
  else status = `<span class="tag tag-none">⚠ ${rule.hint||'待匹配'}</span>`;
  return `<tr>
    <td class="item-num">${b['序号']}</td>
    <td><span class="item-name">${b['名称']}</span><br><span class="item-spec">${b['规格']}</span></td>
    <td></td>
    <td class="item-qty">${b['工程量'].toLocaleString()} <span style="font-size:13px;color:var(--muted);">${b['单位']}</span></td>
    <td></td>
    <td>${status}</td>
  </tr>`;
}).join('');

// 逐项详情卡片
let sectionsHtml = '';
for (const b of boq) {
  const rule = boqMatchRules[b['序号']];
  const matched = filterItems(allItems, rule.kw);
  const bldSet = new Set(matched.map(m=>m.building));
  const avgQty = matched.length>0 ? Math.round(b['工程量']/matched.length) : 0;

  sectionsHtml += `<div class="match-card open ${matched.length===0?'none':(bldSet.size<10?'partial':'')}">`;

  // 卡片头
  sectionsHtml += `<div class="card-header" onclick="this.parentElement.classList.toggle('open')">
    <span class="arrow">▶</span>
    <span style="font-size:24px;font-weight:800;color:var(--muted);min-width:36px;">${b['序号']}</span>
    <div>
      <div style="font-size:18px;font-weight:700;">${b['名称']}</div>
      <div style="font-size:13px;color:var(--muted);">${b['规格']}</div>
    </div>
    <div class="summary-stats">
      <div>匹配做法<br><strong>${matched.length} 条</strong></div>
      <div>覆盖楼栋<br><strong>${bldSet.size} 栋</strong></div>
      ${avgQty>0?`<div>均分估算<br><strong>~${avgQty} ${b['单位']}/条</strong></div>`:''}
    </div>
  </div>`;

  // 卡片体
  sectionsHtml += `<div class="card-body">`;

  if (matched.length === 0) {
    sectionsHtml += `<div class="gap-box"><strong>⚠ 当前无匹配</strong><br>${rule.hint||'图纸做法表中未找到对应项。'}当前管线仅提取了地面/楼面做法表，BOQ中油漆涂料/墙砖/吊顶等项需要扩展提取内墙、顶棚做法表。</div>`;
  } else {
    // 按楼栋分组
    const byBld = {};
    for (const m of matched) {
      if (!byBld[m.building]) byBld[m.building] = [];
      byBld[m.building].push(m);
    }

    sectionsHtml += `<table class="sub">
      <tr><th style="width:10%">楼栋</th><th style="width:10%">编号</th><th style="width:18%">部位</th><th>构造层次（从底到面）</th><th style="width:8%">完整度</th></tr>`;

    for (const [bld, items] of Object.entries(byBld).sort()) {
      items.forEach((it, idx) => {
        sectionsHtml += `<tr>
          <td>${idx===0?`<strong>${bld}</strong>`:''}</td>
          <td><strong>${it.code}</strong></td>
          <td>${it.location||'<span style="color:var(--muted);">未标注</span>'}</td>
          <td><ul class="layers">
            ${it.layers.map(l => {
              const d = l['做法']||'';
              const fr = l['燃烧性能等级']||'';
              return `<li><span class="seq">${l['序号']||'·'}.</span>${d}${fr?`<span class="fr">${fr}</span>`:''}</li>`;
            }).join('')}
          </ul></td>
          <td>${it.integrity?`<span class="tag tag-${it.integrity==='完整'?'match':'partial'}">${it.integrity}</span>`:'−'}</td>
        </tr>`;
      });
    }
    sectionsHtml += `</table>`;

    // 材料汇总
    if (rule.itemType === '地面材料') {
      const mats = new Set();
      matched.forEach(m => m.layers.forEach(l => { const d = (l['做法']||'').trim(); if (d.length>3) mats.add(d); }));
      sectionsHtml += `<div class="material-bar"><strong>📦 涉及材料（${mats.size} 种）：</strong>${[...mats].slice(0,20).join('；')}${mats.size>20?`…等共${mats.size}种`:''}</div>`;
    }
  }

  sectionsHtml += `</div></div>`;
}
document.getElementById('matchSections').innerHTML = sectionsHtml;
</script>
</body>
</html>
